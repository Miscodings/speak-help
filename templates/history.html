{% extends "base.html" %}
{% block title %}SpeakHelp — Progress History{% endblock %}

{% block content %}

<!-- Thin brand strip -->
<header class="page-strip">
  <h1 class="strip-title">Progress History</h1>
  <p class="strip-sub">your public speaking journey · by justin dutta</p>
</header>

<!-- Overview -->
<section class="overview">
  <div class="container">
    <div class="overview-grid">
      <div class="overview-card">
        <div class="ov-label">Total Sessions</div>
        <div class="ov-val" id="ovTotal">—</div>
      </div>
      <div class="overview-card">
        <div class="ov-label">Avg WPM</div>
        <div class="ov-val" id="ovAvgWpm">—</div>
      </div>
      <div class="overview-card">
        <div class="ov-label">Personal Best</div>
        <div class="ov-val" id="ovBestWpm">—</div>
      </div>
    </div>
  </div>
</section>

<!-- Session list -->
<section class="sessions">
  <div class="container">
    <p class="sessions-label">All Sessions</p>

    <div class="sessions-list" id="historyContainer">
      <!-- skeletons while loading -->
      <div class="skel"></div>
      <div class="skel"></div>
      <div class="skel"></div>
    </div>

    <div style="text-align:center;">
      <a href="/" class="back-link">← Back to Studio</a>
    </div>
  </div>
</section>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
{% endblock %}
