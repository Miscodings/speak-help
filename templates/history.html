{% extends "base.html" %}
{% block title %}SpeakHelp — Progress History{% endblock %}

{% block content %}

<!-- Page hero -->
<section class="page-hero">
  <div class="hero-canvas">
    <div class="orb orb-a"></div>
    <div class="orb orb-c"></div>
  </div>
  <div style="position:relative;z-index:1;">
    <h1 class="page-title">Progress <em>History</em></h1>
    <p class="page-sub">Your public speaking journey, at a glance.</p>
  </div>
</section>

<!-- Overview -->
<section class="overview">
  <div class="container">
    <div class="overview-grid">
      <div class="overview-card">
        <div class="ov-label">Total Sessions</div>
        <div class="ov-val" id="ovTotal">—</div>
      </div>
      <div class="overview-card">
        <div class="ov-label">Avg WPM</div>
        <div class="ov-val" id="ovAvgWpm">—</div>
      </div>
      <div class="overview-card">
        <div class="ov-label">Personal Best</div>
        <div class="ov-val" id="ovBestWpm">—</div>
      </div>
    </div>
  </div>
</section>

<!-- Session list -->
<section class="sessions">
  <div class="container">
    <p class="sessions-label">All Sessions</p>

    <div class="sessions-list" id="historyContainer">
      <!-- skeletons while loading -->
      <div class="skel"></div>
      <div class="skel"></div>
      <div class="skel"></div>
    </div>

    <div style="text-align:center;">
      <a href="/" class="back-link">← Back to Studio</a>
    </div>
  </div>
</section>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
{% endblock %}
