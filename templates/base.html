<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SpeakHelp{% endblock %}</title>

  <!-- Prevent flash of wrong theme -->
  <script>
    (function(){
      var t=localStorage.getItem('speakhelp-theme')||'light';
      document.documentElement.setAttribute('data-theme',t);
    })();
  </script>

  <!-- Fonts: DM Serif Display (editorial) + Syne (geometric UI) + DM Mono (numbers) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>

  <!-- Navbar -->
  {% block navbar %}
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-brand">
        <div class="brand-mark">🎙️</div>
        <span class="brand-word">SpeakHelp</span>
      </a>
      <div class="nav-actions">
        <a href="/"        class="nav-link {% if request.endpoint == 'index'   %}active{% endif %}">Studio</a>
        <a href="/history" class="nav-link {% if request.endpoint == 'history' %}active{% endif %}">Progress</a>
        {% if current_user.is_authenticated %}
          <span class="nav-user">{{ current_user.email }}</span>
          <span class="nav-tier tier-{{ current_user.tier }}">{{ current_user.tier }}</span>
          <a href="/logout" class="nav-link">Logout</a>
        {% endif %}
        <button class="theme-btn" id="themeBtn" aria-label="Toggle dark mode">
          <span class="theme-icon">☀️</span>
        </button>
      </div>
    </div>
  </nav>
  {% endblock %}

  <main>{% block content %}{% endblock %}</main>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="{{ url_for('static', filename='js/animations.js') }}"></script>

  {% block scripts %}{% endblock %}
</body>
</html>
